name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances Capacitor
        run: npm install --no-audit --no-fund

      - name: Projet Android
        run: |
          npx cap add android
          npx cap sync android
          # icônes de l'app
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/* android/app/src/main/res/

      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publication dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk survival.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk survival.apk \
            --target "${{ github.sha }}" \
            --title "Survival – APK Android" \
            --notes "Dernière version, construite automatiquement depuis le commit ${{ github.sha }}. Télécharge survival.apk sur ton téléphone puis ouvre-le pour l'installer (autorise l'installation depuis cette source si Android le demande)." \
            --latest
