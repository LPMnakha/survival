<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Survival</title>
  <meta name="description" content="Une forêt où se promener, tranquillement.">
  <meta name="theme-color" content="#1c140f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Survival">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="joy" aria-hidden="true"><div id="joy-knob"></div></div>

  <button id="sound" hidden aria-label="Couper le son">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/>
      <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M17.8 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path class="cross" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="hint-pill" aria-live="polite"></div>
  <div id="actions"></div>

  <div id="hud" hidden>
    <button id="btn-inv" class="hud-icon" aria-label="Inventaire">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8.5 7V5.8A3.5 3.5 0 0 1 15.5 5.8V7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 8.5c0-.8.7-1.5 1.5-1.5h11c.8 0 1.5.7 1.5 1.5L18.3 19a2 2 0 0 1-2 1.8H7.7a2 2 0 0 1-2-1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div id="quick"></div>
    <button id="btn-craft" class="hud-icon" aria-label="Fabriquer">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M13.5 6.5l4-2 2 2-2 4-1.8.3-6.9 6.9a1.6 1.6 0 0 1-2.3-2.3l6.9-6.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 5l3.2 3.2M4.5 8.6 8.6 4.5M14 14l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="inv-sheet" class="sheet" role="dialog" aria-label="Inventaire">
    <p class="sheet-title">Inventaire</p>
    <div id="inv-slots"></div>
    <button id="btn-drop" class="drop-btn" disabled>Jeter</button>
    <p class="sheet-hint">Les 3 premières cases sont l’accès rapide. Touche une case puis une autre pour les échanger, ou « Jeter » pour poser un objet au sol.</p>
    <button class="sheet-close">Fermer</button>
  </div>

  <div id="craft-sheet" class="sheet" role="dialog" aria-label="Fabriquer">
    <p class="sheet-title">Fabriquer</p>
    <div id="recipes"></div>
    <button class="sheet-close">Fermer</button>
  </div>

  <div id="intro">
    <div class="card">
      <h1>Survival</h1>
      <p class="sub">La forêt</p>
      <button id="enter">Entrer</button>
      <p id="hint"></p>
      <p id="meteo"></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
