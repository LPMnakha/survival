<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Survival</title>
  <meta name="description" content="Une forêt où se promener, tranquillement.">
  <meta name="theme-color" content="#1c140f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Survival">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="joy" aria-hidden="true"><div id="joy-knob"></div></div>

  <button id="sound" hidden aria-label="Couper le son">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/>
      <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M17.8 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path class="cross" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="intro">
    <div class="card">
      <h1>Survival</h1>
      <p class="sub">La forêt</p>
      <button id="enter">Entrer</button>
      <p id="hint"></p>
      <p id="meteo"></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
